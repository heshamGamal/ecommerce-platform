name: OpenAPI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI document
        run: npx --yes @redocly/cli lint docs/openapi.json
      - name: Reject legacy API references
        run: |
          ! grep -RInE '/api/webhooks|/api/products|/api/customer' .env.example CHECKOUT_PAYMENT_SHIPPING_BASELINE_AR.md docs routes
