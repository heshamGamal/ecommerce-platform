name: OpenAPI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI document
        run: npx --yes @redocly/cli lint docs/openapi.json
