name: Architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run strict architecture tests
        run: php artisan test --testsuite=Unit --filter=StrictArchitectureTest

      - name: Run all tests
        run: php artisan test
